<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#000000">
  <meta name="viewport" content="width=device-width, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <title>Rémy SABLIET - Web designer | Full stack | Freelancer</title>
  <meta name="description"
    content="Rémy SABLIET is a Senior Full-Stack engineer | Next.js, React, Node.js, & AWS | Building Scalable, Modern Applications for Seamless User Experiences.">
  <meta name="keywords"
    content="Rémy SABLIET, remy sabliet, remy, sabliet, remysab, front-end,front end, web designer, developer, freelance, back-end, full stack engineer ">

  <!-- Favicon and App Icons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  
  <style>
    /* Hide scrollBar but allow scrolling */
    body,
    html {
      position: relative;
      border: 0;
      padding: 0;
      margin: 0;
      position: relative;
      /*Important: BUG Safari fixed: relative position on the body allow the 
  foreground div to get the whole place of its parent container (originally bottom:0 didn't worked and foreground take the viewport view only  */
      width: 100%;
      overflow: hidden;
      background-color: black;
      font-family: "Franklin Gothic Medium";
    }

    /* Integrate HTML CSS inline of the index.html for a quicker initial rendering speed  */
    @keyframes run {
      0% {
        left: -40px;
        color: #eee;
      }

      50% {
        color: #666;
      }

      100% {
        left: 40px;
        color: #eee;
      }
    }

    .rs-splash-screen-container {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .rs-splash-screen-container .rs-splash-screen {
      position: absolute;
      width: 100%;
      height: 10vh;
      top: 50%;
      left: 50%;
      transform: translate3d(-50%, -50%, 0);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .rs-splash-screen .rs-loading-dot {
      font-size: 100px;
      margin-top: -40px;
      position: relative;
      animation: ease-in-out infinite alternate;
      animation-name: run;
      animation-duration: 1.2s;
    }
  </style>
</head>

<script>
  function afterAssetLoaded() {
    var script = document.createElement('script');
    script.src = "/src/index.jsx";
    script.type = "module";
    document.body.appendChild(script);
    document.getElementsByClassName('rs-splash-screen-container')[0].style.display = "none";
  }
</script>


<body>
  <noscript>
    You need to enable JavaScript to run this app.
  </noscript>

  <div id="root"></div>

  <script type="module" src="/src/index.jsx"></script>
</body>

</html>
